<post>
    <h2><a href="{% if locale %}{{ url_for('blog_post_' + locale, post_id=post.slug) }}{% else %}{{ url_for('blog_post', post_id=post.slug) }}{% endif %}">{{ post.title }}</a></h2>
    <p>
      {% if post.description %}
      {{ post.description }}<br/>  
      {% endif %}
      <small><time datetime="{{ post.date }}">{{ post.date }}</time></small><br />
      {% if post.tags %}
        {{ t.blog.tags_prefix }} {% for tag in post.tags %}
          <a href="{% if locale %}{{ url_for('blog_tag_' + locale, tag_id=tag) }}{% else %}{{ url_for('blog_tag', tag_id=tag) }}{% endif %}">{{ tag }}</a>
        {% endfor %}
      {% endif %}
    </p>
</post>

{% extends "layouts/base.html" %}
{% block content %}
<h1>{{ t.blog.tags }}</h1>

{% for tag, count in tags.items() %}
  <a href="{% if locale %}{{ url_for('blog_tag_locale', locale=locale, tag_id=tag) }}{% else %}{{ url_for('blog_tag', tag_id=tag) }}{% endif %}">{{ tag }}</a> ({{ count }})
{% endfor %}
{% endblock content %}

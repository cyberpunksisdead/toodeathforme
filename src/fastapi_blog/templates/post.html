{% extends "layouts/base.html" %}
{% block content %}
<h1>{{ post.title }}</h1>


{{ post.content|safe }}

{% if post.tags and post.tags | length > 0 %}
<p>{{ t.blog.tags_prefix }} 


{% for tag in post.tags %}
    <a href="{% if locale %}{{ url_for('blog_tag_locale', locale=locale, tag_id=tag) }}{% else %}{{ url_for('blog_tag', tag_id=tag) }}{% endif %}">{{ tag }}</a>
{% endfor %}
</p>
{% endif %}

{% endblock content %}

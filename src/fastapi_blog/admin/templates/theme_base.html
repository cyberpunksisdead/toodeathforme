{% extends "layout.html" %}

{% block head_css %}
{{ super() }}
<style>
/* Dark theme styles */
[data-bs-theme="dark"] {
    --tblr-body-bg: #1e293b;
    --tblr-body-color: #e2e8f0;
    --tblr-card-bg: #2d3748;
    --tblr-border-color: #4a5568;
    --tblr-navbar-bg: #1a202c;
}

[data-bs-theme="dark"] .card {
    background-color: var(--tblr-card-bg);
    border-color: var(--tblr-border-color);
}

[data-bs-theme="dark"] .navbar {
    background-color: var(--tblr-navbar-bg) !important;
    border-bottom-color: var(--tblr-border-color);
}

[data-bs-theme="dark"] .table {
    color: var(--tblr-body-color);
    border-color: var(--tblr-border-color);
}

[data-bs-theme="dark"] .table-hover tbody tr:hover {
    background-color: rgba(255, 255, 255, 0.05);
}

[data-bs-theme="dark"] .form-control,
[data-bs-theme="dark"] .form-select {
    background-color: #374151;
    border-color: var(--tblr-border-color);
    color: var(--tblr-body-color);
}

[data-bs-theme="dark"] .btn-outline-primary {
    color: #60a5fa;
    border-color: #60a5fa;
}

[data-bs-theme="dark"] .btn-outline-primary:hover {
    background-color: #60a5fa;
    color: #1e293b;
}

[data-bs-theme="dark"] .text-muted {
    color: #94a3b8 !important;
}

/* Theme switcher button styles */
.theme-switcher {
    display: inline-flex !important;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    transition: all 0.2s;
}

.theme-switcher:hover {
    background-color: rgba(0, 0, 0, 0.05);
}

[data-bs-theme="dark"] .theme-switcher:hover {
    background-color: rgba(255, 255, 255, 0.05);
}

.theme-switcher .icon {
    width: 1.2rem;
    height: 1.2rem;
    margin-right: 0.25rem;
}
</style>

<script>
// Theme management
(function() {
    const THEME_KEY = 'admin-theme';
    
    function getStoredTheme() {
        return localStorage.getItem(THEME_KEY) || 'auto';  // Default: auto (system theme)
    }
    
    function setStoredTheme(theme) {
        localStorage.setItem(THEME_KEY, theme);
    }
    
    function getPreferredTheme() {
        const storedTheme = getStoredTheme();
        if (storedTheme !== 'auto') {
            return storedTheme;
        }
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    
    function setTheme(theme) {
        document.documentElement.setAttribute('data-bs-theme', theme);
    }
    
    function updateThemeIcon(currentTheme) {
        const icon = document.querySelector('.theme-switcher .icon');
        const text = document.querySelector('.theme-switcher .theme-text');
        
        if (!icon || !text) return;
        
        const themes = {
            'light': {
                icon: '<path stroke="none" d="M0 0h24v24H0z" fill="none"/><circle cx="12" cy="12" r="4"/><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" />',
                text: 'Light'
            },
            'dark': {
                icon: '<path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" />',
                text: 'Dark'
            },
            'auto': {
                icon: '<path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 5a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-10z" /><path d="M7 20h10" /><path d="M9 16v4" /><path d="M15 16v4" />',
                text: 'Auto'
            }
        };
        
        if (icon && text) {
            icon.innerHTML = themes[currentTheme].icon;
            text.textContent = themes[currentTheme].text;
        }
    }
    
    function cycleTheme() {
        const themes = ['light', 'dark', 'auto'];
        const currentTheme = getStoredTheme();
        const currentIndex = themes.indexOf(currentTheme);
        const nextTheme = themes[(currentIndex + 1) % themes.length];
        
        setStoredTheme(nextTheme);
        const actualTheme = nextTheme === 'auto' ? getPreferredTheme() : nextTheme;
        setTheme(actualTheme);
        updateThemeIcon(nextTheme);
    }
    
    // Initialize theme on page load
    window.addEventListener('DOMContentLoaded', function() {
        const theme = getPreferredTheme();
        setTheme(theme);
        updateThemeIcon(getStoredTheme());
        
        // Add click handler to theme switcher
        const switcher = document.querySelector('.theme-switcher');
        if (switcher) {
            switcher.addEventListener('click', cycleTheme);
        }
        
        // Listen for system theme changes when in auto mode
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            if (getStoredTheme() === 'auto') {
                setTheme(e.matches ? 'dark' : 'light');
            }
        });
    });
})();
</script>
{% endblock %}

{% block footer_js %}
{{ super() }}
<script>
// Add theme switcher to navbar after page loads
document.addEventListener('DOMContentLoaded', function() {
    console.log('[Theme Switcher] Initializing...');
    
    // Try multiple selectors to find the right place to add the theme switcher
    const selectors = [
        '.navbar-nav',           // Standard Bootstrap navbar
        '.navbar .navbar-nav',   // More specific
        'nav.navbar ul',         // Generic nav approach
        '.nav-item:last-child',  // Try to find existing nav items
        'header nav',            // Header navigation
        'header .navbar',        // Header navbar
        '.navbar-collapse',      // Navbar collapse area
    ];
    
    let navContainer = null;
    
    for (const selector of selectors) {
        navContainer = document.querySelector(selector);
        if (navContainer) {
            console.log('[Theme Switcher] Found navbar using selector:', selector);
            console.log('[Theme Switcher] Container element:', navContainer);
            break;
        }
    }
    
    if (!navContainer) {
        console.error('[Theme Switcher] Could not find navbar element');
        console.log('[Theme Switcher] Available elements:');
        console.log('  - nav elements:', document.querySelectorAll('nav'));
        console.log('  - navbar elements:', document.querySelectorAll('.navbar'));
        console.log('  - header elements:', document.querySelectorAll('header'));
        
        // Fallback: add to body as a floating button
        const floatingButton = document.createElement('div');
        floatingButton.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 9999;';
        floatingButton.innerHTML = `
            <button class="theme-switcher btn btn-primary" title="Toggle theme (Light/Dark/Auto)" style="border-radius: 50%; width: 50px; height: 50px; padding: 0;">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                    <path d="M3 5a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-10z" />
                    <path d="M7 20h10" />
                    <path d="M9 16v4" />
                    <path d="M15 16v4" />
                </svg>
            </button>
        `;
        document.body.appendChild(floatingButton);
        console.log('[Theme Switcher] Added as floating button');
        return;
    }
    
    // Create theme switcher element
    const themeSwitcher = document.createElement('li');
    themeSwitcher.className = 'nav-item';
    themeSwitcher.innerHTML = `
        <button class="theme-switcher nav-link" title="Toggle theme (Light/Dark/Auto)">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                <path d="M3 5a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-10z" />
                <path d="M7 20h10" />
                <path d="M9 16v4" />
                <path d="M15 16v4" />
            </svg>
            <span class="theme-text">Auto</span>
        </button>
    `;
    navContainer.appendChild(themeSwitcher);
    console.log('[Theme Switcher] Added to navbar');
});
</script>
{% endblock %}

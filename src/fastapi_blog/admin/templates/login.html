{% extends "@starlette-admin/login.html" %}

{% block head_css %}
{{ super() }}
<style>
/* Container for theme and language switchers */
.login-switchers-container {
  position: fixed;
  top: 1rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex;
  justify-content: center;
  gap: 0.75rem;
}

.login-theme-switcher .btn,
.login-language-switcher .btn {
  padding: 0.5rem 0.75rem;
  border-radius: 0.375rem;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

/* Ensure login form stays centered */
.page {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.container-tight {
  margin: 0 auto;
}

/* Theme transition */
.page,
.card,
.form-control,
.btn {
  transition: background-color 0.27s ease-out,
              color 0.27s ease-out,
              border-color 0.27s ease-out;
}

/* Dark theme for login page */
[data-bs-theme="dark"] .page {
  background-color: #1e293b;
  color: #e2e8f0;
}

[data-bs-theme="dark"] .card {
  background-color: #2d3748;
  border-color: #4a5568;
}

[data-bs-theme="dark"] .form-control {
  background-color: #374151;
  border-color: #4a5568;
  color: #e2e8f0;
}

[data-bs-theme="dark"] .form-control:focus {
  background-color: #374151;
  border-color: #60a5fa;
  color: #e2e8f0;
}

[data-bs-theme="dark"] .form-label {
  color: #e2e8f0;
}

[data-bs-theme="dark"] .card-title {
  color: #f1f5f9;
}
</style>
{% endblock %}

{% block content %}
<!-- Switchers Container -->
<div class="login-switchers-container">
  <!-- Theme Switcher -->
  <div class="login-theme-switcher">
    <button type="button" class="btn btn-outline-primary" id="theme-toggle" title="Toggle theme">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" class="theme-icon">
        <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
        <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>
      </svg>
      <span class="theme-label">Auto</span>
    </button>
  </div>

  <!-- Language Switcher -->
  <div class="login-language-switcher">
    <div class="dropdown">
      <button type="button" class="btn btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-language" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
          <path d="M4 5h7"></path>
          <path d="M9 3v2c0 4.418 -2.239 8 -5 8"></path>
          <path d="M5 9c-.003 2.144 2.952 3.908 6.7 4"></path>
          <path d="M12 20l4 -9l4 9"></path>
          <path d="M19.1 18h-6.2"></path>
        </svg>
        <span class="login-current-language">English</span>
      </button>
      <div class="dropdown-menu">
        <a href="#" class="dropdown-item login-language-item" data-lang="en">English</a>
        <a href="#" class="dropdown-item login-language-item" data-lang="ru">Русский</a>
      </div>
    </div>
  </div>
</div>

{{ super() }}
{% endblock %}

{% block footer_js %}
{{ super() }}
<script>
(function() {
  // Theme Switcher Logic - Single Toggle Button
  const themes = ['auto', 'light', 'dark'];
  const themeIcons = {
    'auto': '<path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/><path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>',
    'light': '<path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z"/>',
    'dark': '<path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278zM4.858 1.311A7.269 7.269 0 0 0 1.025 7.71c0 4.02 3.279 7.276 7.319 7.276a7.316 7.316 0 0 0 5.205-2.162c-.337.042-.68.063-1.029.063-4.61 0-8.343-3.714-8.343-8.29 0-1.167.242-2.278.681-3.286z"/>'
  };
  const themeLabels = {
    'auto': 'Auto',
    'light': 'Light',
    'dark': 'Dark'
  };
  
  const getStoredTheme = () => localStorage.getItem('theme') || 'auto';
  const setStoredTheme = theme => localStorage.setItem('theme', theme);
  
  const getSystemTheme = () => {
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  };
  
  const getEffectiveTheme = theme => {
    return theme === 'auto' ? getSystemTheme() : theme;
  };
  
  const updateThemeButton = theme => {
    const button = document.getElementById('theme-toggle');
    const icon = button.querySelector('.theme-icon');
    const label = button.querySelector('.theme-label');
    
    icon.innerHTML = themeIcons[theme];
    label.textContent = themeLabels[theme];
    button.setAttribute('title', `Current theme: ${themeLabels[theme]}`);
  };
  
  const applyTheme = theme => {
    const effectiveTheme = getEffectiveTheme(theme);
    document.documentElement.setAttribute('data-bs-theme', effectiveTheme);
    updateThemeButton(theme);
  };
  
  // Initialize theme on page load
  const currentTheme = getStoredTheme();
  applyTheme(currentTheme);
  
  // Theme toggle button handler - cycles through themes
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const currentTheme = getStoredTheme();
    const currentIndex = themes.indexOf(currentTheme);
    const nextIndex = (currentIndex + 1) % themes.length;
    const nextTheme = themes[nextIndex];
    
    setStoredTheme(nextTheme);
    applyTheme(nextTheme);
  });
  
  // Listen for system theme changes when in auto mode
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    const currentTheme = getStoredTheme();
    if (currentTheme === 'auto') {
      applyTheme('auto');
    }
  });
  
  // Language Switcher Logic
  const pathMatch = window.location.pathname.match(/^\/admin\/([a-z]{2})/);
  const currentLocale = pathMatch ? pathMatch[1] : 'en';
  const localeNames = {
    'en': 'English',
    'ru': 'Русский'
  };
  
  // Update current language display
  const currentLangSpan = document.querySelector('.login-current-language');
  if (currentLangSpan) {
    currentLangSpan.textContent = localeNames[currentLocale] || currentLocale.toUpperCase();
  }
  
  // Language switcher click handlers
  document.querySelectorAll('.login-language-item').forEach(item => {
    item.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const targetLocale = this.getAttribute('data-lang');
      const currentPath = window.location.pathname;
      const pathMatch = currentPath.match(/^\/admin\/([a-z]{2})(\/.*)?$/);
      
      if (pathMatch) {
        const restOfPath = pathMatch[2] || '';
        const newPath = `/admin/${targetLocale}${restOfPath}`;
        const queryString = window.location.search;
        window.location.href = newPath + queryString;
      } else {
        window.location.href = `/admin/${targetLocale}/login`;
      }
    });
  });
})();
</script>
{% endblock %}

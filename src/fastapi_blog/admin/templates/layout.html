{% extends "@starlette-admin/layout.html" %}

{% block head %}
{{ super() }}
<script>
// Common language switching utility
// Available in all pages via window.languageSwitcher
window.languageSwitcher = {
  availableLocales: {{ available_locales | tojson | safe }},
  localeNames: {{ locale_names | tojson | safe }},
  currentLocale: '{{ current_locale }}',
  
  // Switch to a different locale
  switchTo: function(targetLocale) {
    const currentPath = window.location.pathname;
    const pathMatch = currentPath.match(/^\/admin\/([a-z]{2})(\/.*)?$/);
    
    if (pathMatch) {
      const restOfPath = pathMatch[2] || '';
      const newPath = `/admin/${targetLocale}${restOfPath}`;
      const queryString = window.location.search;
      window.location.href = newPath + queryString;
    } else {
      window.location.href = `/admin/${targetLocale}`;
    }
  },
  
  // Get display name for a locale
  getLocaleName: function(locale) {
    return this.localeNames[locale] || locale.toUpperCase();
  }
};
</script>
{% endblock %}

{% block head_css %}
{{ super() }}
<style>
/* Theme transition configuration */
:root {
    --theme-transition-duration: 0.27s;
    --theme-transition-timing: ease-out;
    --theme-transition: 
        background-color var(--theme-transition-duration) var(--theme-transition-timing),
        color var(--theme-transition-duration) var(--theme-transition-timing),
        border-color var(--theme-transition-duration) var(--theme-transition-timing);
}

/* Apply smooth transitions only to key UI elements for better performance */
body,
.page,
.page-wrapper,
.page-body,
.card,
.navbar,
.navbar-nav,
.nav-link,
.avatar,
.avatar svg,
.avatar .icon,
.table,
.form-control,
.form-select,
.btn,
.dropdown-menu,
.list-group-item,
.badge,
.alert {
    transition: background-color 0.27s ease-out !important,
                color 0.27s ease-out !important,
                border-color 0.27s ease-out !important;
}

/* Respect user's motion preferences */
@media (prefers-reduced-motion: reduce) {
    :root {
        --theme-transition-duration: 0s;
    }
    
    body,
    .page,
    .page-wrapper,
    .page-body,
    .card,
    .navbar,
    .navbar-nav,
    .nav-link,
    .avatar,
    .avatar svg,
    .avatar .icon,
    .table,
    .form-control,
    .form-select,
    .btn,
    .dropdown-menu,
    .list-group-item,
    .badge,
    .alert {
        transition: none !important;
    }
}

/* Dark theme styles */
[data-bs-theme="dark"] {
    --tblr-body-bg: #1e293b;
    --tblr-body-color: #e2e8f0;
    --tblr-card-bg: #2d3748;
    --tblr-border-color: #4a5568;
    --tblr-navbar-bg: #1a202c;
}

[data-bs-theme="dark"] .card {
    background-color: var(--tblr-card-bg);
    border-color: var(--tblr-border-color);
}

[data-bs-theme="dark"] .navbar {
    background-color: var(--tblr-navbar-bg) !important;
    border-bottom-color: var(--tblr-border-color);
}

[data-bs-theme="dark"] .table {
    color: var(--tblr-body-color);
    border-color: var(--tblr-border-color);
}

[data-bs-theme="dark"] .table-hover tbody tr:hover {
    background-color: rgba(255, 255, 255, 0.05);
}

[data-bs-theme="dark"] .form-control,
[data-bs-theme="dark"] .form-select {
    background-color: #374151;
    border-color: var(--tblr-border-color);
    color: var(--tblr-body-color);
}

[data-bs-theme="dark"] .btn-outline-primary {
    color: #60a5fa;
    border-color: #60a5fa;
}

[data-bs-theme="dark"] .btn-outline-primary:hover {
    background-color: #60a5fa;
    color: #1e293b;
}

[data-bs-theme="dark"] .text-muted {
    color: #94a3b8 !important;
}

/* Style user dropdown as button using Tabler classes */
.navbar-nav .nav-item.dropdown > a.nav-link {
    /* Make it look like .btn */
    display: inline-flex;
    align-items: center;
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
    font-weight: 400;
    line-height: 1.4285714286;
    color: inherit;
    text-align: center;
    text-decoration: none;
    white-space: nowrap;
    vertical-align: middle;
    cursor: pointer;
    user-select: none;
    border: 1px solid rgba(98, 105, 118, 0.16);
    border-radius: 4px;
    background-color: #ffffff;
    transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out,
                border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
}

.navbar-nav .nav-item.dropdown > a.nav-link:hover {
    color: inherit;
    background-color: rgba(32, 107, 196, 0.06);
    border-color: rgba(98, 105, 118, 0.16);
}

[data-bs-theme="dark"] .navbar-nav .nav-item.dropdown > a.nav-link {
    background-color: var(--tblr-card-bg);
    border-color: var(--tblr-border-color);
}

[data-bs-theme="dark"] .navbar-nav .nav-item.dropdown > a.nav-link:hover {
    background-color: rgba(255, 255, 255, 0.05);
}

/* Add dropdown arrow like .dropdown-toggle */
.navbar-nav .nav-item.dropdown > a.nav-link::after {
    display: inline-block;
    margin-left: 0.255em;
    vertical-align: 0.255em;
    content: "";
    border-top: 0.3em solid;
    border-right: 0.3em solid transparent;
    border-bottom: 0;
    border-left: 0.3em solid transparent;
}

/* Avatar spacing */
.navbar-nav .nav-item.dropdown > a.nav-link .avatar {
    margin-right: 0.5rem;
}

/* Custom language switcher styles */
.custom-language-switcher {
  margin-right: 0.5rem;
}

.custom-language-switcher .dropdown-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}
</style>
{% endblock %}

{% block navbar %}
{{ super() }}
<!-- Custom theme and language switchers -->
<script>
(function() {
  const ls = window.languageSwitcher;
  
  document.addEventListener('DOMContentLoaded', function() {
    const navbar = document.querySelector('.navbar.navbar-expand-md .navbar-nav.order-md-last');
    if (!navbar) return;
    
    // Theme Switcher - Light/Dark toggle
    const getSystemTheme = () => {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    };
    
    const getStoredTheme = () => {
      const stored = localStorage.getItem('theme');
      return stored || getSystemTheme();
    };
    
    const setStoredTheme = theme => localStorage.setItem('theme', theme);
    
    const applyTheme = theme => {
      document.documentElement.setAttribute('data-bs-theme', theme);
      const icon = document.querySelector('#theme-toggle-icon');
      if (icon) {
        if (theme === 'dark') {
          icon.innerHTML = '<path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278zM4.858 1.311A7.269 7.269 0 0 0 1.025 7.71c0 4.02 3.279 7.276 7.319 7.276a7.316 7.316 0 0 0 5.205-2.162c-.337.042-.68.063-1.029.063-4.61 0-8.343-3.714-8.343-8.29 0-1.167.242-2.278.681-3.286z"/>';
        } else {
          icon.innerHTML = '<path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z"/>';
        }
      }
    };
    
    // Add theme switcher button
    const themeButton = `
      <div class="nav-item custom-theme-switcher" style="margin-right: 0.5rem;">
        <button type="button" class="btn" id="theme-toggle" title="Toggle theme">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" id="theme-toggle-icon">
            <path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z"/>
          </svg>
        </button>
      </div>
    `;
    
    navbar.insertAdjacentHTML('afterbegin', themeButton);
    
    // Initialize theme
    const currentTheme = getStoredTheme();
    applyTheme(currentTheme);
    
    // Theme toggle handler
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const currentTheme = getStoredTheme();
      const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
      setStoredTheme(nextTheme);
      applyTheme(nextTheme);
    });
    
    // Language Switcher
    if (!ls || ls.availableLocales.length <= 1) return;
    
    // Create custom switcher HTML
    const switcherHTML = `
      <div class="nav-item dropdown custom-language-switcher">
        <button type="button" class="btn dropdown-toggle" data-bs-toggle="dropdown">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-language" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <path d="M4 5h7"></path>
            <path d="M9 3v2c0 4.418 -2.239 8 -5 8"></path>
            <path d="M5 9c-.003 2.144 2.952 3.908 6.7 4"></path>
            <path d="M12 20l4 -9l4 9"></path>
            <path d="M19.1 18h-6.2"></path>
          </svg>
          <span>${ls.getLocaleName(ls.currentLocale)}</span>
        </button>
        <div class="dropdown-menu">
          ${ls.availableLocales.map(lang => `
            <a href="#" class="dropdown-item custom-language-item" data-lang="${lang}">
              ${ls.getLocaleName(lang)}
            </a>
          `).join('')}
        </div>
      </div>
    `;
    
    // Insert before other items
    navbar.insertAdjacentHTML('afterbegin', switcherHTML);
    
    // Add click handlers using shared utility
    document.querySelectorAll('.custom-language-item').forEach(item => {
      item.addEventListener('click', function(e) {
        e.preventDefault();
        const targetLocale = this.getAttribute('data-lang');
        ls.switchTo(targetLocale);
      });
    });
  });
})();
</script>
{% endblock %}

{% block footer_js %}
{{ super() }}
{% endblock %}
